<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🍅 Tomato Customer Map</title>

    <meta name="theme-color" content="#d92d20">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />

    <!-- Marker Cluster -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"
    />

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <aside class="sidebar">

        <div class="logo">

            <h1>🍅 Tomato</h1>
            <span>Customer Map</span>

        </div>

        <!-- DASHBOARD -->

        <section class="dashboard">

            <div class="card">

                <span>Clienti</span>

                <strong id="totalCustomers">0</strong>

            </div>

            <div class="card">

                <span>Attivi</span>

                <strong id="activeCustomers">0</strong>

            </div>

            <div class="card">

                <span>Geolocalizzati</span>

                <strong id="geoCustomers">0</strong>

            </div>

            <div class="card">

                <span>Visualizzati</span>

                <strong id="visibleCustomers">0</strong>

            </div>

        </section>

        <!-- SEARCH -->

        <section class="search">

            <input
                id="searchInput"
                type="text"
                placeholder="Cerca cliente, via, città, P.IVA..."
            >

        </section>

        <!-- FILTERS -->

        <section class="filters">

            <select id="statusFilter">
                <option value="">Tutti gli stati</option>
            </select>

            <select id="provinceFilter">
                <option value="">Tutte le province</option>
            </select>

            <select id="cityFilter">
                <option value="">Tutti i comuni</option>
            </select>

        </section>

        <!-- LEGEND -->

        <section class="legend">

            <h3>Legenda</h3>

            <div class="legend-item">

                <span class="dot green"></span>

                Attivo

            </div>

            <div class="legend-item">

                <span class="dot red"></span>

                Inattivo

            </div>

            <div class="legend-item">

                <span class="dot orange"></span>

                Stand By

            </div>

        </section>

        <footer>

            <small>

                Aggiornamento automatico da n8n

            </small>

        </footer>

    </aside>

    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->

    <main>

        <!-- HEADER -->

        <header>

            <div>

                <h2>Tomato Customer Map</h2>

                <p>

                    Gestione clienti geolocalizzati

                </p>

            </div>

            <button id="fitButton">

                📍 Mostra tutti

            </button>

        </header>

        <!-- MAP -->

        <section id="map"></section>

    </main>

</div>

<!-- Leaflet -->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Marker Cluster -->

<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<!-- App -->

<script src="app.js"></script>

</body>
</html>
