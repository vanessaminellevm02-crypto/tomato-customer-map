name: Complete customer geocoding

on:
  push:
    paths:
      - '.github/workflows/geocode-customers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Geocode customers safely
        env:
          NOMINATIM_URL: https://nominatim.openstreetmap.org/search
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import unicodedata
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          path = Path('data/customers.json')
          customers = json.loads(path.read_text(encoding='utf-8'))

          def norm(value):
              text = unicodedata.normalize('NFD', str(value or ''))
              return ' '.join(''.join(c for c in text if unicodedata.category(c) != 'Mn').lower().split())

          def digits(value):
              return ''.join(c for c in str(value or '') if c.isdigit())

          def cap5(value):
              value = digits(value)
              return value.zfill(5) if value else ''

          def field(row, *keys):
              for key in keys:
                  value = row.get(key)
                  if value is not None and str(value).strip():
                      return str(value).strip()
              return ''

          def city(row):
              return field(row, 'comune', 'col_9', 'Comune', 'city')

          def province(row):
              return field(row, 'provincia', 'PROVINCIA', 'province', 'Province')

          def street(row):
              return field(row, 'indirizzo', 'VIA', 'Indirizzo cliente', 'Address')

          def request_json(params):
              request = Request(
                  f'{__import__("os").environ["NOMINATIM_URL"]}?{urlencode(params)}',
                  headers={'User-Agent': 'TomatoCustomerMap/1.1'}
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode('utf-8'))
              except Exception as exc:
                  print(f'Geocoding error: {type(exc).__name__}: {params}')
                  return []

          def result_city(address):
              return norm(address.get('city') or address.get('town') or address.get('village') or address.get('municipality') or '')

          def result_country(address):
              return norm(address.get('country_code'))

          def result_cap(address):
              return cap5(address.get('postcode'))

          def road(address):
              return norm(address.get('road') or address.get('pedestrian') or address.get('street') or '')

          def usable_candidate(candidate, target_city, target_cap):
              if not isinstance(candidate, dict) or not candidate.get('lat') or not candidate.get('lon'):
                  return None
              address = candidate.get('address') or {}
              if result_country(address) not in ('', 'it'):
                  return None
              rc = result_city(address)
              rp = result_cap(address)
              if not target_city or not rc:
                  return None
              city_ok = rc == target_city or target_city in rc or rc in target_city
              cap_ok = not target_cap or not rp or rp == target_cap
              if not city_ok or not cap_ok:
                  return None
              return candidate

          def score_candidate(candidate, target_city, target_cap, target_street):
              address = candidate.get('address') or {}
              score = 0
              rc = result_city(address)
              rp = result_cap(address)
              rr = road(address)
              if rc == target_city:
                  score += 100
              elif target_city in rc or rc in target_city:
                  score += 70
              if target_cap and rp == target_cap:
                  score += 80
              if target_street and rr:
                  target_words = set(re.findall(r'[a-z0-9]+', norm(target_street)))
                  result_words = set(re.findall(r'[a-z0-9]+', rr))
                  score += min(len(target_words & result_words), 3) * 15
              return score

          cache = {}
          stats = {'VERIFICATO': 0, 'COMUNE': 0, 'DA_VERIFICARE': 0, 'SENZA_INDIRIZZO': 0}

          for index, row in enumerate(customers, start=1):
              s = street(row)
              c = city(row)
              p = province(row)
              cp = cap5(row.get('CAP'))
              target_city = norm(c)
              cache_key = '|'.join([norm(s), cp, target_city, norm(p)])

              if not s and not c and not cp:
                  row.update(lat=None, lng=None, geocode_status='SENZA_INDIRIZZO', geocode_precision='NESSUNA', geocode_reason='Indirizzo insufficiente', geocode_query='', geocode_display_name='')
                  stats['SENZA_INDIRIZZO'] += 1
                  continue

              candidates = cache.get(cache_key)
              if candidates is None:
                  candidates = []
                  if s or c or cp:
                      params = {'format':'jsonv2','addressdetails':1,'limit':10,'countrycodes':'it'}
                      if s: params['street'] = s
                      if c: params['city'] = c
                      if cp: params['postalcode'] = cp
                      candidates = request_json(params)
                      time.sleep(1.1)
                  cache[cache_key] = candidates if isinstance(candidates, list) else []

              best = None
              best_score = -1
              for candidate in cache[cache_key]:
                  valid = usable_candidate(candidate, target_city, cp)
                  if valid:
                      score = score_candidate(valid, target_city, cp, s)
                      if score > best_score:
                          best, best_score = valid, score

              if best:
                  address = best.get('address') or {}
                  row.update(
                      lat=float(best['lat']),
                      lng=float(best['lon']),
                      geocode_status='VERIFICATO',
                      geocode_precision='STRADA/COMUNE' if road(address) else 'COMUNE/CAP',
                      geocode_reason='Coordinate coerenti con il Comune; CAP verificato quando disponibile',
                      geocode_query=', '.join(x for x in [s, cp, c, p, 'Italia'] if x),
                      geocode_display_name=best.get('display_name', '')
                  )
                  stats['VERIFICATO'] += 1
                  continue

              # Fallback: query ONLY the municipality. This prevents an unresolved
              # street result from becoming a random coordinate elsewhere.
              city_candidates = []
              if c:
                  city_candidates = request_json({
                      'q': ', '.join(x for x in [c, p, 'Italia'] if x),
                      'format': 'jsonv2',
                      'addressdetails': 1,
                      'limit': 10,
                      'countrycodes': 'it'
                  })
                  time.sleep(1.1)

              city_best = None
              city_score = -1
              for candidate in city_candidates if isinstance(city_candidates, list) else []:
                  if not isinstance(candidate, dict) or not candidate.get('lat') or not candidate.get('lon'):
                      continue
                  address = candidate.get('address') or {}
                  if result_country(address) not in ('', 'it'):
                      continue
                  rc = result_city(address)
                  if not rc or not target_city:
                      continue
                  if rc != target_city and target_city not in rc and rc not in target_city:
                      continue
                  # Never accept an administrative polygon/area as the final point.
                  typ = norm(candidate.get('type'))
                  cls = norm(candidate.get('class'))
                  if typ in {'boundary','administrative'} or cls == 'boundary':
                      continue
                  score = 100 if rc == target_city else 70
                  if cp and result_cap(address) == cp:
                      score += 50
                  if score > city_score:
                      city_best, city_score = candidate, score

              if city_best:
                  row.update(
                      lat=float(city_best['lat']),
                      lng=float(city_best['lon']),
                      geocode_status='VERIFICATO',
                      geocode_precision='COMUNE',
                      geocode_reason='Fallback sul Comune: nessun indirizzo affidabile, coordinate del Comune',
                      geocode_query=', '.join(x for x in [c, p, 'Italia'] if x),
                      geocode_display_name=city_best.get('display_name', '')
                  )
                  stats['COMUNE'] += 1
              else:
                  row.update(
                      lat=None,
                      lng=None,
                      geocode_status='DA_VERIFICARE',
                      geocode_precision='NESSUNA',
                      geocode_reason='Nessun risultato affidabile nel Comune indicato',
                      geocode_query=', '.join(x for x in [s, cp, c, p, 'Italia'] if x),
                      geocode_display_name=''
                  )
                  stats['DA_VERIFICARE'] += 1

              if index % 25 == 0:
                  print(f'Progress: {index}/{len(customers)}')

          path.write_text(json.dumps(customers, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('--- RISULTATO ---')
          print(f'Clienti totali: {len(customers)}')
          print(f'Verificati indirizzo: {stats["VERIFICATO"]}')
          print(f'Verificati Comune fallback: {stats["COMUNE"]}')
          print(f'Da verificare: {stats["DA_VERIFICARE"]}')
          print(f'Senza indirizzo: {stats["SENZA_INDIRIZZO"]}')
          PY

      - name: Commit database
        run: |
          git config user.name 'tomato-map-bot'
          git config user.email 'tomato-map-bot@users.noreply.github.com'
          git add data/customers.json
          if git diff --cached --quiet; then
            echo 'Nessuna modifica al database.'
            exit 0
          fi
          git commit -m 'Fix geocoding: coordinate affidabili per strada o comune'
          git push
