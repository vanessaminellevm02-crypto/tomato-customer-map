name: Complete customer geocoding

on:
  push:
    paths:
      - '.github/workflows/geocode-customers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Geocode ALL customer addresses
        env:
          NOMINATIM_URL: https://nominatim.openstreetmap.org/search
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import unicodedata
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          path = Path('data/customers.json')
          customers = json.loads(path.read_text(encoding='utf-8'))

          def norm(value):
              text = unicodedata.normalize('NFD', str(value or ''))
              text = ''.join(c for c in text if unicodedata.category(c) != 'Mn')
              return ' '.join(text.lower().split())

          def digits(value):
              return ''.join(c for c in str(value or '') if c.isdigit())

          def cap5(value):
              value = digits(value)
              return value.zfill(5) if value else ''

          def city_from_row(row):
              return str(row.get('comune') or row.get('col_9') or row.get('Comune') or row.get('city') or '').strip()

          def province_from_row(row):
              return str(row.get('provincia') or row.get('PROVINCIA') or row.get('province') or '').strip()

          def street_from_row(row):
              return str(row.get('indirizzo') or row.get('VIA') or row.get('Indirizzo cliente') or '').strip()

          def street_words(street):
              text = norm(street)
              for prefix in ('via ', 'viale ', 'piazza ', 'corso ', 'largo ', 'strada ', 'localita ', 'località '):
                  if text.startswith(prefix):
                      text = text[len(prefix):]
                      break
              return {word for word in re.findall(r'[a-z0-9]+', text) if len(word) > 1 and not word.isdigit()}

          def candidate_city(address):
              return norm(
                  address.get('city') or
                  address.get('town') or
                  address.get('village') or
                  address.get('municipality') or
                  address.get('suburb') or
                  address.get('city_district') or ''
              )

          def candidate_road(address):
              return norm(address.get('road') or address.get('pedestrian') or address.get('street') or '')

          def request_json(params):
              query = urlencode(params)
              request = Request(
                  f'{__import__("os").environ["NOMINATIM_URL"]}?{query}',
                  headers={'User-Agent': 'TomatoCustomerMap/1.0 (customer database geocoder)'}
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode('utf-8'))
              except Exception as exc:
                  print(f'Geocoding error: {params} -> {type(exc).__name__}')
                  return []

          cache = {}
          geocoded = 0
          unresolved = 0
          no_address = 0

          for index, row in enumerate(customers, start=1):
              street = street_from_row(row)
              city = city_from_row(row)
              cap = cap5(row.get('CAP'))
              province = province_from_row(row)
              target_words = street_words(street)

              if not street and not city and not cap:
                  row['lat'] = None
                  row['lng'] = None
                  row['geocode_status'] = 'SENZA_INDIRIZZO'
                  row['geocode_precision'] = 'NESSUNA'
                  row['geocode_reason'] = 'Indirizzo insufficiente'
                  row['geocode_query'] = ''
                  row['geocode_display_name'] = ''
                  no_address += 1
                  continue

              cache_key = '|'.join([norm(street), cap, norm(city), norm(province)])

              if cache_key not in cache:
                  candidates = []
                  structured = {
                      'format': 'jsonv2',
                      'addressdetails': 1,
                      'limit': 5,
                      'countrycodes': 'it',
                      'country': 'Italia'
                  }
                  if street:
                      structured['street'] = street
                  if city:
                      structured['city'] = city
                  if cap:
                      structured['postalcode'] = cap

                  candidates = request_json(structured)
                  time.sleep(1.1)

                  if not candidates:
                      query = ', '.join(x for x in [street, cap, city, province, 'Italia'] if x)
                      candidates = request_json({
                          'q': query,
                          'format': 'jsonv2',
                          'addressdetails': 1,
                          'limit': 5,
                          'countrycodes': 'it'
                      })
                      time.sleep(1.1)

                  cache[cache_key] = candidates if isinstance(candidates, list) else []

              candidates = cache[cache_key]
              best = None
              best_score = -999

              target_city = norm(city)
              target_cap = cap

              for candidate in candidates:
                  if not isinstance(candidate, dict) or not candidate.get('lat') or not candidate.get('lon'):
                      continue

                  address = candidate.get('address') or {}
                  country_code = norm(address.get('country_code'))
                  if country_code and country_code != 'it':
                      continue

                  result_cap = cap5(address.get('postcode'))
                  result_city = candidate_city(address)
                  result_road = candidate_road(address)
                  result_words = set(re.findall(r'[a-z0-9]+', result_road))

                  score = 0

                  # For this map, the priority is the CORRECT TOWN/LOCALITY.
                  if target_city and result_city == target_city:
                      score += 100
                  elif target_city and result_city and (target_city in result_city or result_city in target_city):
                      score += 70
                  elif target_city and result_city:
                      score -= 150

                  # CAP is the second strong check. A missing CAP in the result is tolerated.
                  if target_cap and result_cap == target_cap:
                      score += 80
                  elif target_cap and result_cap and result_cap != target_cap:
                      score -= 120

                  # Street match improves the result but is NOT required to match the civic number.
                  overlap = len(target_words.intersection(result_words))
                  if overlap >= 1:
                      score += 25
                  if overlap >= 2:
                      score += 15

                  if target_words and result_road and norm(street) == result_road:
                      score += 20

                  if score > best_score:
                      best_score = score
                      best = candidate

              if best:
                  address = best.get('address') or {}
                  result_cap = cap5(address.get('postcode'))
                  result_city = candidate_city(address)
                  country_code = norm(address.get('country_code'))

                  # Accept town-level coordinates: exact civic number is NOT required.
                  city_ok = bool(target_city) and bool(result_city) and (result_city == target_city or target_city in result_city or result_city in target_city)
                  cap_ok = not target_cap or not result_cap or result_cap == target_cap
                  country_ok = not country_code or country_code == 'it'

                  if city_ok and cap_ok and country_ok and best_score >= 80:
                      row['lat'] = float(best['lat'])
                      row['lng'] = float(best['lon'])
                      row['geocode_status'] = 'VERIFICATO'
                      row['geocode_precision'] = 'COMUNE/CAP'
                      row['geocode_reason'] = 'Coordinate coerenti con comune e CAP; precisione al comune accettata'
                      row['geocode_query'] = ', '.join(x for x in [street, cap, city, province, 'Italia'] if x)
                      row['geocode_display_name'] = best.get('display_name', '')
                      geocoded += 1
                      continue

              row['lat'] = None
              row['lng'] = None
              row['geocode_status'] = 'DA_VERIFICARE'
              row['geocode_precision'] = 'NESSUNA'
              row['geocode_reason'] = 'Nessun risultato coerente con il comune/CAP'
              row['geocode_query'] = ', '.join(x for x in [street, cap, city, province, 'Italia'] if x)
              row['geocode_display_name'] = ''
              unresolved += 1

              if index % 25 == 0:
                  print(f'Progress: {index}/{len(customers)}')

          path.write_text(json.dumps(customers, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('--- RISULTATO ---')
          print(f'Clienti totali: {len(customers)}')
          print(f'Coordinate verificate: {geocoded}')
          print(f'Da verificare: {unresolved}')
          print(f'Senza indirizzo: {no_address}')
          print(f'Indirizzi unici geocodificati: {len(cache)}')
          PY

      - name: Commit database
        run: |
          git config user.name 'tomato-map-bot'
          git config user.email 'tomato-map-bot@users.noreply.github.com'
          git add data/customers.json
          if git diff --cached --quiet; then
            echo 'Nessuna modifica al database.'
            exit 0
          fi
          git commit -m 'Corregge geolocalizzazione a livello comune e CAP'
          git push
