name: Complete customer geocoding

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/geocode-customers.yml'

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Geocode municipalities safely
        run: |
          python - <<'PY'
          import json,re,time,unicodedata
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request,urlopen
          path=Path('data/customers.json')
          raw=json.loads(path.read_text(encoding='utf-8'))
          if isinstance(raw,dict):
              raw=raw.get('customers') or raw.get('data') or raw.get('content')
              if isinstance(raw,str): raw=json.loads(raw)
          if not isinstance(raw,list) or not raw: raise SystemExit('Database non valido/vuoto: STOP')
          def norm(v):
              s=unicodedata.normalize('NFD',str(v or '')); s=''.join(c for c in s if unicodedata.category(c)!='Mn'); return ' '.join(s.lower().split())
          def get(r,*ks):
              for k in ks:
                  if r.get(k) not in (None,''): return str(r[k]).strip()
              return ''
          def city(r): return get(r,'comune','col_9','Comune','city')
          def prov(r): return get(r,'provincia','PROVINCIA','province','Province')
          groups={}
          for r in raw:
              c,p=city(r),prov(r)
              if c: groups.setdefault((norm(c),norm(p)),(c,p))
          cache={}
          def fetch(q):
              req=Request('https://nominatim.openstreetmap.org/search?'+urlencode({'q':q,'format':'jsonv2','addressdetails':1,'limit':5,'countrycodes':'it'}),headers={'User-Agent':'TomatoCustomerMap/1.4'})
              try:
                  with urlopen(req,timeout=20) as x:return json.loads(x.read().decode())
              except Exception as e: print('lookup failed',q,type(e).__name__);return []
          for key,(c,p) in groups.items():
              candidates=fetch(', '.join(x for x in (c,p,'Italia') if x)); target=norm(c); best=None; score=-1
              for x in candidates if isinstance(candidates,list) else []:
                  a=x.get('address') or {}; rc=norm(a.get('city') or a.get('town') or a.get('village') or a.get('municipality') or '')
                  if not rc or not(rc==target or rc in target or target in rc):continue
                  if norm(a.get('country_code')) not in ('','it'):continue
                  if norm(x.get('class'))=='boundary' or norm(x.get('type')) in ('boundary','administrative'):continue
                  s=100 if rc==target else 70
                  if s>score:best,score=x,s
              cache[key]=best;time.sleep(1.05)
          verified=missing=0
          for r in raw:
              c,p=city(r),prov(r); best=cache.get((norm(c),norm(p)))
              if best and best.get('lat') and best.get('lon'):
                  r['lat']=float(best['lat']);r['lng']=float(best['lon']);r['geocode_status']='VERIFICATO';r['geocode_precision']='COMUNE';r['geocode_reason']='Posizione del Comune/localita';r['geocode_query']=', '.join(x for x in (c,p,'Italia') if x);r['geocode_display_name']=best.get('display_name','');verified+=1
              else:
                  r['lat']=None;r['lng']=None;r['geocode_status']='DA_VERIFICARE';r['geocode_precision']='NESSUNA';missing+=1
          if verified==0: raise SystemExit('ZERO NUOVE COORDINATE: STOP')
          path.write_text(json.dumps(raw,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('TOTAL',len(raw),'NEW_COORDS',verified,'WITHOUT_COORDS',missing,'MUNICIPALITIES',len(cache))
          PY
      - name: Validate database
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/customers.json',encoding='utf-8'))
          if not isinstance(d,list) or not d: raise SystemExit('Database non valido')
          c=[r for r in d if isinstance(r.get('lat'),(int,float)) and isinstance(r.get('lng'),(int,float))]
          print('TOTAL',len(d),'WITH_COORDS',len(c))
          if not c: raise SystemExit('Nessuna coordinata')
          PY
      - name: Commit database
        run: |
          git config user.name 'tomato-map-bot'
          git config user.email 'tomato-map-bot@users.noreply.github.com'
          git add data/customers.json
          git diff --cached --quiet || (git commit -m 'Geolocalizza clienti per Comune' && git push)
