name: Import missing customer addresses

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/geocode-customers.yml'
      - 'data/address_updates.json'
      - 'data/address_updates_2.json'
      - 'data/address_updates_3.json'
      - 'data/customers.json'

permissions:
  contents: write

jobs:
  import-missing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Import only supplied missing addresses
        run: |
          python - <<'PY'
          import csv,io,json,re,unicodedata
          from pathlib import Path
          from urllib.request import Request,urlopen
          def t(v): return str(v or '').strip()
          def n(v):
              s=unicodedata.normalize('NFKD',t(v)); s=''.join(c for c in s if not unicodedata.combining(c)); s=s.upper().replace('’',"'")
              return ' '.join(re.sub(r'[^A-Z0-9]+',' ',s).split())
          def p(v):
              d=re.sub(r'\D','',t(v)); return d.zfill(11) if d else ''
          def c(v):
              d=re.sub(r'\D','',t(v)); return d.zfill(5) if d else ''
          def get(r,*ks):
              for k in ks:
                  if k in r and t(r[k]): return t(r[k])
              return ''
          data=Path('data/customers.json'); raw=json.loads(data.read_text(encoding='utf-8'))
          if isinstance(raw,dict):
              raw=raw.get('content') or raw.get('customers') or raw.get('data')
              if isinstance(raw,str): raw=json.loads(raw)
          if not isinstance(raw,list) or len(raw)!=662: raise SystemExit('customers.json non valido')
          updates=[]
          for fn in ['data/address_updates.json','data/address_updates_2.json','data/address_updates_3.json']:
              updates += json.loads(Path(fn).read_text(encoding='utf-8'))
          src={}
          for u in updates:
              key=(p(u.get('piva')),n(u.get('nome_locale')))
              payload=(t(u.get('indirizzo')),c(u.get('CAP')),n(u.get('comune')),n(u.get('provincia')))
              if key in src:
                  old=src[key]
                  for idx in (0,1,3):
                      if old[idx] and payload[idx] and old[idx]!=payload[idx]:
                          raise SystemExit(f'Conflitto reale per {key}: {old} vs {payload}')
                  src[key]=tuple(old[i] or payload[i] for i in range(4))
              else: src[key]=payload
          req=Request('https://raw.githubusercontent.com/opendatasicilia/comuni-italiani/main/dati/main.csv',headers={'User-Agent':'TomatoCustomerMap/10.2'})
          towns=list(csv.DictReader(io.StringIO(urlopen(req,timeout=45).read().decode('utf-8-sig'))))
          if len(towns)<7000: raise SystemExit(f'Fonte Comuni incompleta: {len(towns)}')
          by_np={}; by_name={}; by_cp={}; by_cap={}
          for r in towns:
              name=get(r,'comune'); prov=get(r,'sigla'); cc=c(get(r,'cap')); ist=get(r,'pro_com_t')
              try: lat=float(get(r,'lat')); lng=float(get(r,'long'))
              except: continue
              if not name or not ist: continue
              x={'name':name,'prov':prov,'cap':cc,'istat':ist.zfill(6),'lat':lat,'lng':lng}
              by_np.setdefault((n(name),n(prov)),[]).append(x); by_name.setdefault(n(name),[]).append(x)
              if cc: by_cp.setdefault((cc,n(prov)),[]).append(x); by_cap.setdefault(cc,[]).append(x)
          def choose(name,prov,cc):
              q=by_cp.get((c(cc),n(prov)),[]) if c(cc) and n(prov) else []
              if len(q)==1:return q[0]
              q=by_np.get((n(name),n(prov)),[]) if n(name) and n(prov) else []
              if len(q)==1:return q[0]
              q=by_name.get(n(name),[]) if n(name) else []
              if len(q)==1:return q[0]
              q=by_cap.get(c(cc),[]) if c(cc) else []
              if len(q)==1:return q[0]
              return None
          def row_key(r): return (p(get(r,'P.IVA','piva')),n(get(r,'Nome Locale','nome_locale','name')))
          def has_addr(r): return bool(get(r,'VIA','via','indirizzo'))
          before=sum(1 for r in raw if not has_addr(r)); updated=0; already=0; unresolved=[]
          for r in raw:
              k=row_key(r)
              if k not in src: continue
              if has_addr(r): already+=1; continue
              u=src[k]; x=choose(u[2],u[3],u[1])
              if not x:
                  unresolved.append({'piva':k[0],'nome_locale':k[1],'indirizzo':u[0],'CAP':u[1],'comune':u[2],'provincia':u[3]}); continue
              r['VIA']=u[0]; r['CAP']=int(x['cap']) if x['cap'] else ''; r['col_9']=x['name']; r['PROVINCIA']=x['prov']; r['indirizzo']=u[0]; r['comune']=x['name']; r['provincia']=x['prov']; r['address']=', '.join(v for v in [u[0],x['cap'],x['name'],x['prov'],'Italia'] if v); r['lat']=x['lat']; r['lng']=x['lng']; r['geocode_status']='VERIFICATO'; r['geocode_precision']='COMUNE_CENTROIDE'; r['geocode_reason']='Coordinate del Comune di appartenenza'; r['geocode_query']=f"{x['name']}, {x['prov']}, Italia"; r['geocode_display_name']=x['name']; r['geocode_istat']=x['istat']; r['geocode_source']='Open Data Sicilia - main.csv'; updated+=1
          print(f'CLIENTI_TOTALI={len(raw)}'); print(f'SENZA_INDIRIZZO_PRIMA={before}'); print(f'SORGENTE_RIGHE={len(updates)}'); print(f'CHIAVI_UNICHE={len(src)}'); print(f'NUOVI_AGGIORNATI={updated}'); print(f'GIA_PRESENTI={already}'); print(f'NON_RISOLTI={len(unresolved)}')
          if unresolved:
              for z in unresolved: print('NON_RISOLTO',z)
              raise SystemExit('STOP: impossibile determinare il Comune')
          if updated+already != 88: raise SystemExit(f'STOP: {updated+already} record abbinati, attesi 88')
          data.write_text(json.dumps(raw,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/customers.json',encoding='utf-8'))
          assert len(d)==662
          v=sum(1 for r in d if r.get('geocode_status')=='VERIFICATO' and r.get('geocode_precision')=='COMUNE_CENTROIDE')
          assert v>=88
          print(f'VALIDO: {len(d)} clienti; {v} coordinate verificate')
          PY
      - name: Commit database
        run: |
          git config user.name 'tomato-map-bot'
          git config user.email 'tomato-map-bot@users.noreply.github.com'
          git add data/customers.json
          if git diff --cached --quiet; then echo 'Nessuna modifica'; exit 0; fi
          git commit -m 'Completa indirizzi mancanti nella mappa'
          git push
