name: Import missing customer addresses

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/geocode-customers.yml'
      - 'data/customers.json'
      - 'data/address_updates.json'
      - 'data/address_updates_2.json'
      - 'data/address_updates_3.json'

permissions:
  contents: write

jobs:
  import-missing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Import only the 90 supplied missing addresses
        run: |
          python - <<'PY'
          import csv,io,json,re,unicodedata
          from pathlib import Path
          from urllib.request import Request,urlopen
          DATA=Path('data/customers.json')
          def t(v): return str(v or '').strip()
          def n(v):
              s=unicodedata.normalize('NFKD',t(v)); s=''.join(c for c in s if not unicodedata.combining(c)); s=s.upper().replace('’',"'")
              return ' '.join(re.sub(r'[^A-Z0-9]+',' ',s).split())
          def p(v):
              d=re.sub(r'\D','',t(v)); return d.zfill(11) if d else ''
          def c(v):
              d=re.sub(r'\D','',t(v)); return d.zfill(5) if d else ''
          def get(r,*ks):
              for k in ks:
                  if k in r and t(r[k]): return t(r[k])
              return ''
          raw=json.loads(DATA.read_text(encoding='utf-8'))
          if isinstance(raw,dict):
              raw=raw.get('content') or raw.get('customers') or raw.get('data'); raw=json.loads(raw) if isinstance(raw,str) else raw
          if not isinstance(raw,list) or len(raw)!=662: raise SystemExit('customers.json non valido')
          updates=[]
          for fn in ['data/address_updates.json','data/address_updates_2.json','data/address_updates_3.json']:
              updates += json.loads(Path(fn).read_text(encoding='utf-8'))
          src={}
          for u in updates: src[(p(u.get('piva')),n(u.get('nome_locale')))] = u
          txt=urlopen(Request('https://raw.githubusercontent.com/opendatasicilia/comuni-italiani/main/dati/main.csv',headers={'User-Agent':'TomatoCustomerMap/5.0'}),timeout=45).read().decode('utf-8-sig')
          towns=list(csv.DictReader(io.StringIO(txt)))
          by_np={}; by_cp={}; by_name={}; all_t=[]
          for r in towns:
              name=get(r,'comune'); prov=get(r,'sigla'); cc=c(get(r,'cap')); ist=get(r,'pro_com_t')
              try: lat=float(get(r,'lat')); lng=float(get(r,'long'))
              except: continue
              if not name or not ist: continue
              x={'name':name,'prov':prov,'cap':cc,'istat':ist.zfill(6),'lat':lat,'lng':lng}
              by_np.setdefault((n(name),n(prov)),[]).append(x); by_name.setdefault(n(name),[]).append(x); by_cp.setdefault((cc,n(prov)),[]).append(x); all_t.append(x)
          def choose(name,prov,cc):
              q=by_np.get((n(name),n(prov)),[])
              if len(q)==1:return q[0],'COMUNE+PROVINCIA'
              q=by_name.get(n(name),[])
              if len(q)==1:return q[0],'COMUNE'
              q=by_cp.get((c(cc),n(prov)),[])
              if len(q)==1:return q[0],'CAP+PROVINCIA'
              q=[x for x in all_t if c(x['cap'])==c(cc)] if c(cc) else []
              if len(q)==1:return q[0],'CAP'
              return None,None
          def has_addr(r): return bool(get(r,'VIA','via','indirizzo'))
          updated=0; unresolved=[]
          for r in raw:
              if has_addr(r): continue
              key=(p(get(r,'P.IVA','piva')),n(get(r,'Nome Locale','nome_locale','name')))
              u=src.get(key)
              if not u: continue
              town,method=choose(u.get('comune'),u.get('provincia'),u.get('CAP'))
              if not town:
                  unresolved.append({**key,'indirizzo':u.get('indirizzo'),'CAP':u.get('CAP'),'comune':u.get('comune'),'provincia':u.get('provincia')}); continue
              addr=t(u.get('indirizzo')); r['VIA']=addr; r['CAP']=int(town['cap']) if town['cap'] else ''; r['col_9']=town['name']; r['PROVINCIA']=town['prov']; r['indirizzo']=addr; r['comune']=town['name']; r['provincia']=town['prov']; r['address']=', '.join(x for x in [addr,town['cap'],town['name'],town['prov'],'Italia'] if x); r['lat']=town['lat']; r['lng']=town['lng']; r['geocode_status']='VERIFICATO'; r['geocode_precision']='COMUNE_CENTROIDE'; r['geocode_reason']=f'Coordinate del Comune di appartenenza (metodo {method})'; r['geocode_query']=f"{town['name']}, {town['prov']}, Italia"; r['geocode_display_name']=town['name']; r['geocode_istat']=town['istat']; r['geocode_source']='Open Data Sicilia - main.csv'; updated+=1
          print('TOTALI',len(raw),'AGGIORNATI',updated,'NON_RISOLTI',len(unresolved))
          if unresolved: print('\n'.join(map(str,unresolved))); raise SystemExit('STOP: indirizzi non verificati')
          if updated!=90: raise SystemExit(f'STOP: aggiornati {updated}, attesi 90')
          DATA.write_text(json.dumps(raw,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/customers.json',encoding='utf-8'))
          assert isinstance(d,list) and len(d)==662
          assert sum(1 for r in d if r.get('geocode_status')=='VERIFICATO' and r.get('geocode_precision')=='COMUNE_CENTROIDE') >= 90
          print('Database valido:',len(d),'clienti')
          PY
      - name: Commit
        run: |
          git config user.name 'tomato-map-bot'
          git config user.email 'tomato-map-bot@users.noreply.github.com'
          git add data/customers.json
          git diff --cached --quiet || (git commit -m 'Importa indirizzi mancanti nella mappa' && git push)
