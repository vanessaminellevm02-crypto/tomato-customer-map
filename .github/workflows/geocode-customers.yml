name: Complete customer geocoding

on:
  push:
    paths:
      - '.github/workflows/geocode-customers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Geocode addresses
        env:
          NOMINATIM_URL: https://nominatim.openstreetmap.org/search
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import unicodedata
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          path = Path('data/customers.json')
          customers = json.loads(path.read_text(encoding='utf-8'))

          def norm(value):
              text = unicodedata.normalize('NFD', str(value or ''))
              text = ''.join(c for c in text if unicodedata.category(c) != 'Mn')
              return ' '.join(text.lower().split())

          def digits(value):
              return ''.join(c for c in str(value or '') if c.isdigit())

          def cap5(value):
              value = digits(value)
              return value.zfill(5) if value else ''

          def city_from_row(row):
              return str(row.get('comune') or row.get('col_9') or row.get('Comune') or row.get('city') or '').strip()

          def province_from_row(row):
              return str(row.get('provincia') or row.get('PROVINCIA') or row.get('province') or '').strip()

          def street_from_row(row):
              return str(row.get('indirizzo') or row.get('VIA') or row.get('Indirizzo cliente') or '').strip()

          def query_for(row):
              parts = [
                  street_from_row(row),
                  cap5(row.get('CAP')),
                  city_from_row(row),
                  province_from_row(row),
                  'Italia'
              ]
              return ', '.join(x for x in parts if x)

          def house_number(street):
              match = re.search(r'\b(\d+[A-Za-z]?(?:[/-]\d+[A-Za-z]?)?)\b', street or '')
              return norm(match.group(1)) if match else ''

          def street_words(street):
              text = norm(street)
              for prefix in ('via ', 'viale ', 'piazza ', 'corso ', 'largo ', 'strada ', 'localita '):
                  if text.startswith(prefix):
                      text = text[len(prefix):]
              return {word for word in re.findall(r'[a-z0-9]+', text) if len(word) > 1}

          cache = {}
          geocoded = 0
          unresolved = 0

          for row in customers:
              if row.get('lat') is not None and row.get('lng') is not None:
                  continue

              street = street_from_row(row)
              city = city_from_row(row)
              cap = cap5(row.get('CAP'))
              query = query_for(row)

              if not street and not city and not cap:
                  row['lat'] = None
                  row['lng'] = None
                  row['geocode_status'] = 'SENZA_INDIRIZZO'
                  row['geocode_reason'] = 'Indirizzo insufficiente'
                  unresolved += 1
                  continue

              if query not in cache:
                  params = urlencode({
                      'q': query,
                      'format': 'jsonv2',
                      'addressdetails': 1,
                      'limit': 3,
                      'countrycodes': 'it'
                  })
                  request = Request(
                      f'{__import__("os").environ["NOMINATIM_URL"]}?{params}',
                      headers={'User-Agent': 'TomatoCustomerMap/1.0 (customer database geocoder)'}
                  )
                  try:
                      with urlopen(request, timeout=30) as response:
                          cache[query] = json.loads(response.read().decode('utf-8'))
                  except Exception as exc:
                      cache[query] = []
                      print(f'Geocoding error: {query} -> {type(exc).__name__}')
                  time.sleep(1.1)

              candidates = cache[query]
              target_city = norm(city)
              target_cap = cap
              target_house = house_number(street)
              target_words = street_words(street)

              best = None
              best_score = -1

              for candidate in candidates if isinstance(candidates, list) else []:
                  address = candidate.get('address') or {}
                  result_cap = cap5(address.get('postcode'))
                  result_city = norm(
                      address.get('city') or
                      address.get('town') or
                      address.get('village') or
                      address.get('municipality') or
                      address.get('suburb') or ''
                  )
                  result_road = norm(address.get('road') or address.get('pedestrian') or address.get('street') or '')
                  result_house = norm(address.get('house_number') or '')
                  result_words = set(re.findall(r'[a-z0-9]+', result_road))

                  score = 0
                  if target_cap and result_cap == target_cap:
                      score += 50
                  if target_city and result_city == target_city:
                      score += 35
                  if target_house and result_house == target_house:
                      score += 25
                  overlap = len(target_words.intersection(result_words))
                  if overlap >= 1:
                      score += 20
                  if overlap >= 2:
                      score += 15

                  if score > best_score:
                      best_score = score
                      best = candidate

              if best and best.get('lat') and best.get('lon'):
                  address = best.get('address') or {}
                  result_cap = cap5(address.get('postcode'))
                  result_city = norm(
                      address.get('city') or
                      address.get('town') or
                      address.get('village') or
                      address.get('municipality') or
                      address.get('suburb') or ''
                  )

                  cap_ok = not target_cap or not result_cap or target_cap == result_cap
                  city_ok = not target_city or not result_city or target_city == result_city

                  if cap_ok and city_ok and best_score >= 70:
                      row['lat'] = float(best['lat'])
                      row['lng'] = float(best['lon'])
                      row['geocode_status'] = 'VERIFICATO'
                      row['geocode_reason'] = 'Indirizzo verificato con CAP/comune e risultato geocoder'
                      row['geocode_query'] = query
                      row['geocode_display_name'] = best.get('display_name', '')
                      geocoded += 1
                      continue

              row['lat'] = None
              row['lng'] = None
              row['geocode_status'] = 'DA_VERIFICARE'
              row['geocode_reason'] = 'Nessun risultato sufficientemente affidabile'
              row['geocode_query'] = query
              unresolved += 1

          path.write_text(json.dumps(customers, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Clienti totali: {len(customers)}')
          print(f'Nuove coordinate verificate: {geocoded}')
          print(f'Non verificati/senza indirizzo: {unresolved}')
          print(f'Query uniche: {len(cache)}')
          PY

      - name: Commit database
        run: |
          git config user.name 'tomato-map-bot'
          git config user.email 'tomato-map-bot@users.noreply.github.com'
          git add data/customers.json
          if git diff --cached --quiet; then
            echo 'Nessuna modifica al database.'
            exit 0
          fi
          git commit -m 'Completa geolocalizzazione database clienti'
          git push
