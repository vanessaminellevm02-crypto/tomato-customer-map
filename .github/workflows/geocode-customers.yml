name: Complete customer geocoding

on:
  push:
    paths:
      - '.github/workflows/geocode-customers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Geocode by municipality
        env:
          NOMINATIM_URL: https://nominatim.openstreetmap.org/search
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import unicodedata
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          path = Path('data/customers.json')
          customers = json.loads(path.read_text(encoding='utf-8'))

          def norm(v):
              s = unicodedata.normalize('NFD', str(v or ''))
              s = ''.join(c for c in s if unicodedata.category(c) != 'Mn')
              return ' '.join(s.lower().split())

          def cap5(v):
              d = ''.join(c for c in str(v or '') if c.isdigit())
              return d.zfill(5) if d else ''

          def get(row, *keys):
              for k in keys:
                  v = row.get(k)
                  if v is not None and str(v).strip():
                      return str(v).strip()
              return ''

          def municipality(row):
              return get(row, 'comune', 'col_9', 'Comune', 'city')

          def province(row):
              return get(row, 'provincia', 'PROVINCIA', 'province', 'Province')

          # We deliberately geocode at MUNICIPALITY level. The goal is the
          # correct town, not the exact street number.
          cache = {}
          stats = {'COMUNE': 0, 'KEEP': 0, 'DA_VERIFICARE': 0, 'SENZA_INDIRIZZO': 0}

          def fetch(params):
              req = Request(
                  f'{__import__("os").environ["NOMINATIM_URL"]}?{urlencode(params)}',
                  headers={'User-Agent': 'TomatoCustomerMap/1.2 (municipality geocoder)'}
              )
              try:
                  with urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode('utf-8'))
              except Exception as e:
                  print('Geocoding error:', type(e).__name__)
                  return []

          def result_city(address):
              return norm(address.get('city') or address.get('town') or address.get('village') or address.get('municipality') or '')

          for row in customers:
              c = municipality(row)
              p = province(row)
              cp = cap5(row.get('CAP'))

              if not c:
                  # Preserve the customer, but never invent a position.
                  row['lat'] = None
                  row['lng'] = None
                  row['geocode_status'] = 'SENZA_INDIRIZZO'
                  row['geocode_precision'] = 'NESSUNA'
                  row['geocode_reason'] = 'Comune assente nel database'
                  stats['SENZA_INDIRIZZO'] += 1
                  continue

              key = f'{norm(c)}|{norm(p)}'
              if key not in cache:
                  candidates = fetch({
                      'q': ', '.join(x for x in [c, p, 'Italia'] if x),
                      'format': 'jsonv2',
                      'addressdetails': 1,
                      'limit': 10,
                      'countrycodes': 'it'
                  })
                  time.sleep(1.1)

                  target = norm(c)
                  best = None
                  best_score = -1

                  for candidate in candidates if isinstance(candidates, list) else []:
                      if not candidate.get('lat') or not candidate.get('lon'):
                          continue
                      address = candidate.get('address') or {}
                      rc = result_city(address)
                      country = norm(address.get('country_code'))
                      typ = norm(candidate.get('type'))
                      cls = norm(candidate.get('class'))

                      if country and country != 'it':
                          continue
                      if not rc or not (rc == target or rc in target or target in rc):
                          continue

                      # Do not use polygons/boundaries as a marker position.
                      if cls == 'boundary' or typ in {'boundary', 'administrative'}:
                          continue

                      score = 100 if rc == target else 80
                      if cp and cap5(address.get('postcode')) == cp:
                          score += 20

                      if score > best_score:
                          best = candidate
                          best_score = score

                  cache[key] = best

              best = cache[key]

              if best:
                  row['lat'] = float(best['lat'])
                  row['lng'] = float(best['lon'])
                  row['geocode_status'] = 'VERIFICATO'
                  row['geocode_precision'] = 'COMUNE'
                  row['geocode_reason'] = 'Posizione del Comune/località; non è richiesto il civico'
                  row['geocode_query'] = ', '.join(x for x in [c, p, 'Italia'] if x)
                  row['geocode_display_name'] = best.get('display_name', '')
                  stats['COMUNE'] += 1
              else:
                  row['lat'] = None
                  row['lng'] = None
                  row['geocode_status'] = 'DA_VERIFICARE'
                  row['geocode_precision'] = 'NESSUNA'
                  row['geocode_reason'] = 'Comune non trovato con sufficiente certezza'
                  row['geocode_query'] = ', '.join(x for x in [c, p, 'Italia'] if x)
                  row['geocode_display_name'] = ''
                  stats['DA_VERIFICARE'] += 1

          path.write_text(json.dumps(customers, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('--- RISULTATO ---')
          print('Clienti totali:', len(customers))
          print('Posizionati per Comune:', stats['COMUNE'])
          print('Senza Comune:', stats['SENZA_INDIRIZZO'])
          print('Da verificare:', stats['DA_VERIFICARE'])
          print('Comuni geocodificati:', len(cache))
          PY

      - name: Commit database
        run: |
          git config user.name 'tomato-map-bot'
          git config user.email 'tomato-map-bot@users.noreply.github.com'
          git add data/customers.json
          if git diff --cached --quiet; then
            echo 'Nessuna modifica al database.'
            exit 0
          fi
          git commit -m 'Geolocalizza clienti per Comune'
          git push
