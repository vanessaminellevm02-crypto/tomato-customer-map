name: Geocode customers by municipality

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/geocode-customers.yml'
      - 'data/customers.json'

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Assign verified municipality centroids
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import re
          import unicodedata
          from pathlib import Path
          from urllib.request import Request, urlopen

          DATA = Path('data/customers.json')
          COMMUNI_URL = 'https://raw.githubusercontent.com/opendatasicilia/comuni-italiani/main/dati/comuni.csv'
          COORD_URL = 'https://raw.githubusercontent.com/opendatasicilia/comuni-italiani/main/dati/coordinate.csv'

          def norm(value):
              s = unicodedata.normalize('NFKD', str(value or ''))
              s = ''.join(c for c in s if not unicodedata.combining(c))
              s = s.upper().replace('’', "'")
              s = re.sub(r"[^A-Z0-9]+", ' ', s)
              return ' '.join(s.split())

          def get(row, *keys):
              for key in keys:
                  value = row.get(key)
                  if value not in (None, ''):
                      return str(value).strip()
              return ''

          def download(url):
              req = Request(url, headers={'User-Agent': 'TomatoCustomerMap/2.0'})
              with urlopen(req, timeout=30) as response:
                  return response.read().decode('utf-8-sig')

          def read_csv(text):
              sample = text[:5000]
              try:
                  dialect = csv.Sniffer().sniff(sample, delimiters=',;|\t')
              except csv.Error:
                  dialect = csv.excel
              return list(csv.DictReader(io.StringIO(text), dialect=dialect))

          raw = json.loads(DATA.read_text(encoding='utf-8'))
          if isinstance(raw, dict):
              raw = raw.get('customers') or raw.get('data') or raw.get('content')
              if isinstance(raw, str):
                  raw = json.loads(raw)
          if not isinstance(raw, list) or not raw:
              raise SystemExit('Database clienti non valido o vuoto: STOP')

          comuni_rows = read_csv(download(COMMUNI_URL))
          coord_rows = read_csv(download(COORD_URL))
          if not comuni_rows or not coord_rows:
              raise SystemExit('Database Comuni/coordinate non scaricato: STOP')

          comuni_by_code = {}
          comuni_by_name_prov = {}
          comuni_by_name = {}
          for r in comuni_rows:
              code = get(r, 'pro_com_t', 'codice_istat', 'codice')
              name = get(r, 'comune', 'Comune')
              prov = get(r, 'sigla', 'provincia', 'Provincia')
              if not code or not name:
                  continue
              item = {'code': code.zfill(6), 'name': name, 'prov': prov}
              comuni_by_code[item['code']] = item
              comuni_by_name_prov.setdefault((norm(name), norm(prov)), []).append(item)
              comuni_by_name.setdefault(norm(name), []).append(item)

          coords_by_code = {}
          for r in coord_rows:
              code = get(r, 'pro_com_t', 'codice_istat', 'codice')
              lat = get(r, 'lat', 'latitude')
              lng = get(r, 'long', 'lon', 'lng', 'longitude')
              if not code or not lat or not lng:
                  continue
              try:
                  coords_by_code[code.zfill(6)] = (float(lat), float(lng))
              except ValueError:
                  continue

          if len(comuni_by_code) < 7000 or len(coords_by_code) < 7000:
              raise SystemExit(f'Sorgenti incomplete: comuni={len(comuni_by_code)} coordinate={len(coords_by_code)}')

          verified = 0
          missing = []
          ambiguous = []
          for row in raw:
              comune = get(row, 'comune', 'col_9', 'Comune', 'city')
              provincia = get(row, 'provincia', 'PROVINCIA', 'province', 'Province')
              indirizzo = get(row, 'indirizzo', 'VIA', 'address')

              # We only require geocoding when an address exists.
              if not indirizzo:
                  row['lat'] = None
                  row['lng'] = None
                  row['geocode_status'] = 'NESSUN_INDIRIZZO'
                  row['geocode_precision'] = 'NESSUNA'
                  row['geocode_reason'] = 'Nessun indirizzo presente'
                  continue

              candidates = comuni_by_name_prov.get((norm(comune), norm(provincia)), [])
              if len(candidates) == 1:
                  municipality = candidates[0]
              elif len(candidates) > 1:
                  ambiguous.append((row.get('row_number'), comune, provincia, 'nome+provincia non univoco'))
                  continue
              else:
                  name_candidates = comuni_by_name.get(norm(comune), [])
                  if len(name_candidates) == 1:
                      municipality = name_candidates[0]
                  else:
                      ambiguous.append((row.get('row_number'), comune, provincia, 'comune non trovato/univoco'))
                      continue

              coords = coords_by_code.get(municipality['code'])
              if not coords:
                  missing.append((row.get('row_number'), comune, provincia, 'coordinate mancanti nella fonte'))
                  continue

              lat, lng = coords
              row['lat'] = lat
              row['lng'] = lng
              row['geocode_status'] = 'VERIFICATO'
              row['geocode_precision'] = 'COMUNE_CENTROIDE'
              row['geocode_reason'] = 'Centroide del Municipio del Comune di appartenenza'
              row['geocode_query'] = f"{municipality['name']}, {municipality['prov']}, Italia"
              row['geocode_display_name'] = municipality['name']
              row['geocode_istat'] = municipality['code']
              row['geocode_source'] = 'Open Data Sicilia - comuni italiani / coordinate.csv'
              verified += 1

          # Hard safety check: every customer row that has an address MUST have a verified coordinate.
          address_rows = [r for r in raw if get(r, 'indirizzo', 'VIA', 'address')]
          unresolved = [r for r in address_rows if r.get('geocode_status') != 'VERIFICATO' or not isinstance(r.get('lat'), (int, float)) or not isinstance(r.get('lng'), (int, float))]

          print(f'TOTAL_RIGHE={len(raw)}')
          print(f'RIGHE_CON_INDIRIZZO={len(address_rows)}')
          print(f'GEOCODIFICATE_COMUNE={verified}')
          print(f'NON_RISOLTE={len(unresolved)}')
          print(f'AMBIGUE={len(ambiguous)}')
          print(f'COORDINATE_MUNICIPI_DISPONIBILI={len(coords_by_code)}')

          if ambiguous:
              print('AMBIGUE_SAMPLE', ambiguous[:20])
          if missing:
              print('COORDINATE_MANCANTI_SAMPLE', missing[:20])
          if unresolved:
              sample = [(r.get('row_number'), r.get('comune'), r.get('provincia'), r.get('indirizzo') or r.get('VIA')) for r in unresolved[:20]]
              print('NON_RISOLTE_SAMPLE', sample)
              raise SystemExit('STOP: non tutti i clienti con indirizzo hanno un Comune verificato')

          DATA.write_text(json.dumps(raw, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate every addressed customer
        run: |
          python - <<'PY'
          import json
          d = json.load(open('data/customers.json', encoding='utf-8'))
          if not isinstance(d, list) or not d:
              raise SystemExit('Database non valido')
          addressed = [r for r in d if str(r.get('indirizzo') or r.get('VIA') or r.get('address') or '').strip()]
          bad = [r for r in addressed if r.get('geocode_status') != 'VERIFICATO' or r.get('geocode_precision') != 'COMUNE_CENTROIDE' or not isinstance(r.get('lat'), (int,float)) or not isinstance(r.get('lng'), (int,float))]
          print('RIGHE_TOTALI', len(d))
          print('RIGHE_CON_INDIRIZZO', len(addressed))
          print('RIGHE_VERIFICATE', len(addressed) - len(bad))
          print('RIGHE_NON_VERIFICATE', len(bad))
          if bad:
              raise SystemExit('VALIDAZIONE FALLITA: esistono clienti con indirizzo senza coordinate di Comune')
          PY

      - name: Commit corrected database
        run: |
          git config user.name 'tomato-map-bot'
          git config user.email 'tomato-map-bot@users.noreply.github.com'
          git add data/customers.json
          git diff --cached --quiet || (git commit -m 'Correggi geolocalizzazione clienti per Comune' && git push)
