name: Geocode customers by municipality

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/geocode-customers.yml'
      - 'data/customers.json'
      - 'app.js'

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Assign verified municipality centroids
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import re
          import unicodedata
          from pathlib import Path
          from urllib.request import Request, urlopen

          DATA = Path('data/customers.json')
          MUNICIPALITY_URL = 'https://raw.githubusercontent.com/opendatasicilia/comuni-italiani/main/dati/main.csv'

          def norm(value):
              s = unicodedata.normalize('NFKD', str(value or ''))
              s = ''.join(c for c in s if not unicodedata.combining(c))
              s = s.upper().replace('’', "'")
              s = re.sub(r"[^A-Z0-9]+", ' ', s)
              return ' '.join(s.split())

          def get(row, *keys):
              for key in keys:
                  value = row.get(key)
                  if value not in (None, ''):
                      return str(value).strip()
              return ''

          def download(url):
              req = Request(url, headers={'User-Agent': 'TomatoCustomerMap/3.0'})
              with urlopen(req, timeout=30) as response:
                  return response.read().decode('utf-8-sig')

          def read_csv(text):
              return list(csv.DictReader(io.StringIO(text)))

          raw = json.loads(DATA.read_text(encoding='utf-8'))
          if isinstance(raw, dict):
              raw = raw.get('customers') or raw.get('data') or raw.get('content')
              if isinstance(raw, str):
                  raw = json.loads(raw)
          if not isinstance(raw, list) or not raw:
              raise SystemExit('Database clienti non valido o vuoto: STOP')

          municipality_rows = read_csv(download(MUNICIPALITY_URL))
          if len(municipality_rows) < 7000:
              raise SystemExit(f'Database Comuni incompleto: {len(municipality_rows)} righe')

          by_name_prov = {}
          by_name = {}
          by_cap = {}
          for r in municipality_rows:
              name = get(r, 'comune')
              prov = get(r, 'sigla')
              cap = get(r, 'cap')
              code = get(r, 'pro_com_t')
              lat = get(r, 'lat')
              lng = get(r, 'long')
              if not name or not code or not lat or not lng:
                  continue
              try:
                  item = {
                      'name': name,
                      'prov': prov,
                      'cap': cap,
                      'code': code.zfill(6),
                      'lat': float(lat),
                      'lng': float(lng)
                  }
              except ValueError:
                  continue
              by_name_prov.setdefault((norm(name), norm(prov)), []).append(item)
              by_name.setdefault(norm(name), []).append(item)
              if cap:
                  by_cap.setdefault(re.sub(r'\D', '', cap), []).append(item)

          if len(by_name) < 7000:
              raise SystemExit(f'Sorgente Comuni incompleta dopo parsing: {len(by_name)} comuni')

          verified = 0
          unresolved = []

          for row in raw:
              address = get(row, 'indirizzo', 'VIA', 'address')
              if not address:
                  row['lat'] = None
                  row['lng'] = None
                  row['geocode_status'] = 'NESSUN_INDIRIZZO'
                  row['geocode_precision'] = 'NESSUNA'
                  row['geocode_reason'] = 'Nessun indirizzo presente'
                  continue

              comune = get(row, 'comune', 'col_9', 'Comune', 'city')
              provincia = get(row, 'provincia', 'PROVINCIA', 'province', 'Province')
              cap = re.sub(r'\D', '', get(row, 'CAP', 'cap'))

              candidates = by_name_prov.get((norm(comune), norm(provincia)), [])
              if len(candidates) != 1:
                  candidates = by_name.get(norm(comune), [])
              if len(candidates) != 1 and cap:
                  cap_candidates = by_cap.get(cap, [])
                  if len(cap_candidates) == 1:
                      candidates = cap_candidates
                  elif len(cap_candidates) > 1 and comune:
                      same_name = [x for x in cap_candidates if norm(x['name']) == norm(comune)]
                      if len(same_name) == 1:
                          candidates = same_name

              if len(candidates) != 1:
                  unresolved.append({
                      'row': row.get('row_number'),
                      'comune': comune,
                      'provincia': provincia,
                      'cap': cap,
                      'indirizzo': address
                  })
                  continue

              municipality = candidates[0]
              row['lat'] = municipality['lat']
              row['lng'] = municipality['lng']
              row['geocode_status'] = 'VERIFICATO'
              row['geocode_precision'] = 'COMUNE_CENTROIDE'
              row['geocode_reason'] = 'Centroide del Municipio del Comune di appartenenza'
              row['geocode_query'] = f"{municipality['name']}, {municipality['prov']}, Italia"
              row['geocode_display_name'] = municipality['name']
              row['geocode_istat'] = municipality['code']
              row['geocode_source'] = 'Open Data Sicilia - main.csv'
              verified += 1

          addressed = [r for r in raw if get(r, 'indirizzo', 'VIA', 'address')]
          bad = [r for r in addressed if r.get('geocode_status') != 'VERIFICATO' or not isinstance(r.get('lat'), (int, float)) or not isinstance(r.get('lng'), (int, float))]

          print(f'TOTAL_RIGHE={len(raw)}')
          print(f'RIGHE_CON_INDIRIZZO={len(addressed)}')
          print(f'GEOCODIFICATE_COMUNE={verified}')
          print(f'NON_RISOLTE={len(bad)}')
          print(f'COMUNI_NELLA_FONTE={len(by_name)}')

          if unresolved:
              print('NON_RISOLTE_SAMPLE', unresolved[:30])
              raise SystemExit('STOP: ogni cliente con indirizzo deve avere un Comune verificato')

          DATA.write_text(json.dumps(raw, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Final hard validation
        run: |
          python - <<'PY'
          import json
          d = json.load(open('data/customers.json', encoding='utf-8'))
          addressed = [r for r in d if str(r.get('indirizzo') or r.get('VIA') or r.get('address') or '').strip()]
          bad = [r for r in addressed if r.get('geocode_status') != 'VERIFICATO' or r.get('geocode_precision') != 'COMUNE_CENTROIDE' or not isinstance(r.get('lat'), (int,float)) or not isinstance(r.get('lng'), (int,float))]
          print('RIGHE_TOTALI', len(d))
          print('RIGHE_CON_INDIRIZZO', len(addressed))
          print('RIGHE_VERIFICATE', len(addressed) - len(bad))
          print('RIGHE_NON_VERIFICATE', len(bad))
          if bad:
              raise SystemExit('VALIDAZIONE FALLITA')
          PY

      - name: Commit corrected database
        run: |
          git config user.name 'tomato-map-bot'
          git config user.email 'tomato-map-bot@users.noreply.github.com'
          git add data/customers.json
          git diff --cached --quiet || (git commit -m 'Correggi geolocalizzazione clienti per Comune' && git push)
